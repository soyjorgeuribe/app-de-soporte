<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name ="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Mesa de ayuda</title>
</head>

<body>
    <h1>Mesa de Ayuda</h1>
    <form  id="formulario-ticket">
        <label for="titulo">Titulo del problema</label><br>
        <input
            id="titulo"
            name ="titulo"
            type="text"
            placeholder="Ejemaplo: No puedo acceder al correo"
            required
        ><br>
        <label for ="prioridad">Prioridad</label><br>
        <select id="prioridad">
            <option value = "Baja">Baja</option>
            <option value = "media">Media</option>
            <option value = "Alta">Alta</option>
        </select><br>
        <label for="descripcion">Describe el problema</label><br>
        <textarea id="descripcion" required></textarea><br>
        <button type = "submit">Crear Ticket</button>
         <p id = "resultado"></p>
    </form>
    <ul id="lista-tickets" class="lista-tickets"></ul>

    <script>

    const formulario = document.querySelector("#formulario-ticket");
    const titulo = document.querySelector("#titulo");   
    const prioridad = document.querySelector("#prioridad");
    const descripcion = document.querySelector("#descripcion");
    const listaTickets = document.querySelector("#lista-tickets");
    const tickets = JSON.parse(localStorage.getItem("tickets") || "[]");

    function mostrarTicket(ticket){
        const elemento = document.createElement("li");
        elemento.textContent = 
            ticket.titulo + " - " +
            ticket.prioridad + " - " +
            ticket.descripcion + " - " +
            (ticket.estado || "pendiente");

        const botonResolver = document.createElement("button");
        botonResolver.textContent= "Resolver";
        botonResolver.type = "button";

        botonResolver.addEventListener("click", function(){
            ticket.estado = "resuelto";
            localStorage.setItem("tickets", JSON.stringify(tickets));
            listaTickets.textContent = "";

            for (const ticket of tickets){
                mostrarTicket(ticket)
            }
        });
        elemento.append(botonResolver);
        listaTickets.append(elemento);
    }

    for (const ticket of tickets) {
        const elemento = document.createElement("li");
        mostrarTicket(ticket);

     }       


    formulario.addEventListener("submit", function(event){
        event.preventDefault();

        const ticket = {

            titulo : titulo.value,
            prioridad : prioridad.value,
            descripcion : descripcion.value,
            estado : "pendiente"
        };

        tickets.push(ticket);
        localStorage.setItem("tickets", JSON.stringify(tickets));
        mostrarTicket(ticket);
        formulario.reset();

        console.log (tickets);

    });


    </script>

</body>

</html>
